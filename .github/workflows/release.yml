name: Package MB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test platform strategy
        run: npm run test:bilibili
      - name: Test Go application
        run: CGO_ENABLED=0 go test ./...
      - name: Package macOS application
        run: go tool mygo build -sign - -skip-notarize -skip-dmg
      - name: Archive application
        run: ditto -c -k --keepParent build/darwin-arm64/MB.app build/MB-macos-arm64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: MB-macos-arm64
          path: build/MB-macos-arm64.zip
